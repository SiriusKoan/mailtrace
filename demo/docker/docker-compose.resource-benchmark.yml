services:
  loghost:
    ports: !reset []
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.50

  opensearch:
    environment:
      - cluster.name=mailtrace-resource-benchmark
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=wg328GY@3HUY76
    ports: !override
      - "19200:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --silent --fail --insecure
          --user admin:wg328GY@3HUY76
          https://localhost:9200/_cluster/health >/dev/null
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.5

  opensearch-dashboards:
    profiles: [demo-only]

  grafana:
    profiles: [demo-only]

  mx:
    ports: !override
      - "11025:25"
    volumes:
      - ./vector/vector.benchmark.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      loghost:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "postfix status"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.10

  mailer1:
    ports: !override
      - "21025:25"
    volumes:
      - ./vector/vector.benchmark.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      loghost:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exim4 -bpc >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.20

  mailer2:
    ports: !override
      - "21026:25"
    volumes:
      - ./vector/vector.benchmark.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      loghost:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exim4 -bpc >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.21

  mailer3:
    ports: !override
      - "21027:25"
    volumes:
      - ./vector/vector.benchmark.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      loghost:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exim4 -bpc >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.22

  mailpolicy1:
    ports: !reset []
    volumes:
      - ./vector/vector.benchmark.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      loghost:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "postfix status"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.30

  mailpolicy2:
    ports: !reset []
    volumes:
      - ./vector/vector.benchmark.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      loghost:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "postfix status"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.31

  mailpolicy3:
    ports: !reset []
    volumes:
      - ./vector/vector.benchmark.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      loghost:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "postfix status"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.32

  mailbox:
    ports: !override
      - "11143:143"
    volumes:
      - ./vector/vector.benchmark.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      loghost:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "postfix status && doveadm service status imap >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.40

  tempo:
    ports: !override
      - "13200:3200"
    networks:
      mailtrace_net:
        ipv4_address: 192.168.201.60

  mailtrace:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: mailtrace:latest
    network_mode: service:opensearch
    command:
      - python3
      - -m
      - mailtrace
      - tracing
      - --otel-endpoint
      - http://tempo.example.com:4317
    environment:
      - MAILTRACE_CONFIG=/app/config.yaml
      - OTEL_SERVICE_NAME=mailtrace-resource-benchmark
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      tempo:
        condition: service_started

networks:
  mailtrace_net:
    ipam:
      config: !override
        - subnet: 192.168.201.0/24
